name: Tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The test project compiles the visualizer sources directly, so no wasm-tools needed
      - name: Run tests
        run: dotnet test tests/SqlVisualizer.Tests --logger "console;verbosity=normal"
